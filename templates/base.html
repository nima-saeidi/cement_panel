<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}پنل هوش مصنوعی پرتو بتن{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazir', sans-serif;
        }
        .nav-link {
            transition: color 0.3s ease, transform 0.2s ease;
        }
        .nav-link:hover {
            color: #f3f4f6;
            transform: scale(1.05);
        }
        .nav-container {
            background: linear-gradient(90deg, #1e3a8a, #3b82f6);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .brand-name {
            font-size: 1.75rem;
            font-weight: 800;
            color: #ffffff;
            transition: color 0.3s ease;
        }
        .brand-name:hover {
            color: #f3f4f6;
        }
        .login-btn {
            background-color: #1e40af;
            color: #ffffff;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .login-btn:hover {
            background-color: #1e3a8a;
            transform: scale(1.05);
        }
        .login-btn:focus {
            outline: none;
            ring: 2px solid #f3f4f6;
        }
        .register-btn {
            background-color: #f59e0b;
            color: #1f2937;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .register-btn:hover {
            background-color: #d97706;
            transform: scale(1.05);
        }
        .register-btn:focus {
            outline: none;
            ring: 2px solid #f3f4f6;
        }
    </style>
</head>
<body class="bg-gray-200">
    <nav class="nav-container p-4 text-white">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="brand-name">پرتو بتن</a>
            <div class="space-x-6">
                {% if session['user'] %}
                    <a href="{{ url_for('dashboard') }}" class="nav-link text-lg">داشبورد</a>
                    <a href="{{ url_for('logout') }}" class="nav-link text-red-300">خروج</a>
                {% else %}
                    <a href="{{ url_for('login') }}" class="login-btn">ورود</a>
                    <a href="{{ url_for('register') }}" class="register-btn">ثبت‌نام</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mx-auto mt-10">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
